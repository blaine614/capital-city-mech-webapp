spring:
  application:
    name: capital-city-site-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capitalcity}
    username: ${DB_USER:capitalcity}
    password: ${DB_PASSWORD:capitalcity}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    # Outgoing mail server. Leave SMTP_HOST empty and emails are written to the
    # log instead of sent, which is what you want on a laptop.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    # Origins allowed to call the API. Override in production.
    allowed-origins: ${CORS_ORIGINS:http://localhost:4321,http://localhost:3000}
  admin:
    # Shared secret required on admin read endpoints. Replace before deploying.
    token: ${ADMIN_TOKEN:change-me}
  mail:
    # Address the website sends from. Must be on a domain your mail service
    # is allowed to send for.
    from: ${MAIL_FROM:blaine@capitalcitymech.com}
    # Where Contact page service requests are delivered.
    service-requests-to: ${MAIL_SERVICE_REQUESTS_TO:blaine@capitalcitymech.com}
    # Where Careers page job applications are delivered.
    applications-to: ${MAIL_APPLICATIONS_TO:info@capitalcitymech.com}
  portal:
    # Public address of the website, used to build links in portal emails.
    site-url: ${SITE_URL:http://localhost:4321}
    # First office (admin) account. Created on startup if it does not exist;
    # set its password from the portal's "First time here" link.
    admin-email: ${PORTAL_ADMIN_EMAIL:}

management:
  health:
    mail:
      # Keep the health check about the app, not the mail provider.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: warn
