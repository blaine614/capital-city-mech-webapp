spring:
  application:
    name: capital-city-site-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capitalcity}
    username: ${DB_USER:capitalcity}
    password: ${DB_PASSWORD:capitalcity}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    # Origins allowed to call the API. Override in production.
    allowed-origins: ${CORS_ORIGINS:http://localhost:4321,http://localhost:3000}
  admin:
    # Shared secret required on admin read endpoints. Replace before deploying.
    token: ${ADMIN_TOKEN:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: warn
