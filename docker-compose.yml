services:
  db:
    image: postgres:16-alpine
    container_name: capitalcity-db
    environment:
      POSTGRES_DB: capitalcity
      POSTGRES_USER: capitalcity
      POSTGRES_PASSWORD: capitalcity
    ports:
      - "5432:5432"
    volumes:
      - capitalcity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalcity -d capitalcity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  capitalcity-pgdata:
